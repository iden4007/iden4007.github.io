<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12"><meta name="description" content="당신의 새로운 시작을 환영합니다. Welcome to Telos.">
<title>Welcome to Telos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--lime:#d4ff79;--muted:#9b9da7}*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f3f5ef;font-family:Manrope,'Segoe UI',sans-serif;overflow-x:hidden}button{font:inherit}button:focus-visible{outline:2px solid white;outline-offset:6px}canvas{position:fixed;inset:0;pointer-events:none;z-index:3}.page{min-height:100svh;position:relative;isolation:isolate;overflow:hidden;padding:32px 5vw 24px;display:flex;flex-direction:column}.glow{position:absolute;z-index:-2;width:850px;height:850px;left:50%;top:48%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,#286c7340,transparent 60%);pointer-events:none}.grid{position:absolute;inset:0;z-index:-3;opacity:.16;background-image:linear-gradient(#a4b4c211 1px,transparent 1px),linear-gradient(90deg,#a4b4c211 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(ellipse,black,transparent 75%)}header,footer{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:25px;letter-spacing:-1.4px;font-weight:800;display:flex;align-items:center;gap:11px}.mark{color:var(--lime);font-size:31px;line-height:1}.edition{font-size:10px;letter-spacing:2px;color:var(--muted)}.sound{background:#ffffff07;border:1px solid #ffffff26;color:#c7cbd1;border-radius:50px;padding:10px 15px;font-size:11px;cursor:pointer}.sound:hover{border-color:var(--lime);color:var(--lime)}main{flex:1;min-height:650px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}.hero{position:relative;z-index:1;padding:70px 0 80px;width:100%}.eyebrow{font-size:10px;letter-spacing:3.3px;color:#c9d3c1;display:flex;justify-content:center;align-items:center;gap:10px}.dot{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 15px #d4ff7980}h1{margin:33px 0 21px;font-weight:500;line-height:.91;letter-spacing:-8px}.welcome{display:block;font-size:clamp(38px,6.3vw,85px);letter-spacing:-4px;font-weight:400;margin-bottom:10px}.telos{font-size:clamp(110px,22vw,295px);font-weight:800;letter-spacing:-.085em;padding-right:.08em;background:linear-gradient(130deg,#f6ffe5 12%,#d4ff79 40%,#8ad9ac 64%,#77d1dc 83%);background-clip:text;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 42px #b1ff6422)}.description{color:#a3aab4;font-size:14px;line-height:1.9;margin:27px 0 29px;letter-spacing:.15px}.celebrate{border:0;background:var(--lime);color:#17200b;padding:17px 24px;border-radius:50px;display:inline-flex;align-items:center;gap:32px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 0 40px #d4ff7919;transition:transform .2s,box-shadow .2s}.celebrate:hover{transform:translateY(-3px);box-shadow:0 0 45px #d4ff7940}.celebrate span{font-size:20px;font-weight:400;line-height:16px}.hint{margin-top:17px;color:#666e7b;font-size:10px;letter-spacing:1px}.orbit{position:absolute;z-index:-1;border:1px solid #b1edbc21;border-radius:50%;width:min(89vw,1100px);height:350px;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-22deg);box-shadow:0 0 35px #6aff8810,inset 0 0 35px #6aff8808}.orbit.two{width:min(76vw,950px);height:520px;transform:translate(-50%,-50%) rotate(30deg);border-color:#84ccff12}.orbit:after{content:'';position:absolute;left:16%;top:10%;width:9px;height:9px;background:#d4ff79;border-radius:50%;box-shadow:0 0 22px #d4ff79;animation:glimmer 4s ease-in-out infinite}.orbit.two:after{left:89%;top:77%;background:#83dbed;width:5px;height:5px}.star{position:absolute;font-size:40px;color:var(--lime);left:16%;top:32%;animation:float 7s ease-in-out infinite}.star.small{left:auto;right:15%;top:65%;font-size:25px;color:#7dcbd4;animation-delay:-3s}.coordinate{position:absolute;left:0;top:51%;writing-mode:vertical-rl;font-size:9px;letter-spacing:2px;color:#66717c}.side{position:absolute;right:0;top:48%;writing-mode:vertical-rl;font-size:9px;letter-spacing:2px;color:#66717c}footer{border-top:1px solid #ffffff13;padding-top:21px;font-size:10px;letter-spacing:1px;color:#7e8692}.footer-left{display:flex;gap:12px;align-items:center}.footer-right{color:#a9b3a0}.toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,20px);border:1px solid #d4ff7940;border-radius:50px;background:#182019ed;color:#e8ffd1;padding:13px 24px;font-size:13px;opacity:0;transition:.3s;z-index:5;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes float{50%{transform:translateY(-16px) rotate(30deg)}}@keyframes glimmer{50%{opacity:.4;box-shadow:0 0 40px #d4ff79}}@media(min-width:1500px){main{min-height:760px}}@media(max-width:600px){.page{padding:24px 24px 20px}main{min-height:590px}.edition{display:none}.welcome{letter-spacing:-2px}h1{margin-top:35px}.description{font-size:12px}.orbit{height:240px;width:130vw}.orbit.two{height:380px;width:100vw}.star{left:5%;top:23%;font-size:28px}.star.small{right:5%;top:73%}.coordinate,.side{display:none}.hero{padding:65px 0}.eyebrow{font-size:8px;letter-spacing:2px}footer{font-size:8px;letter-spacing:.5px}.footer-left{gap:7px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas>
<div class="page"><div class="glow"></div><div class="grid"></div>
<header><div class="brand"><span class="mark" aria-hidden="true">✳</span> telos</div><span class="edition">A NEW BEGINNING / 새로운 시작</span><button class="sound" id="motion" aria-pressed="false">효과 일시정지 Ⅱ</button></header>
<main><div class="orbit"></div><div class="orbit two"></div><span class="star" aria-hidden="true">✦</span><span class="star small" aria-hidden="true">✦</span><span class="coordinate">THE NEXT CHAPTER STARTS HERE</span><span class="side">IMAGINE. BEGIN. BECOME.</span>
<div class="hero"><div class="eyebrow"><i class="dot"></i> SOMETHING EXTRAORDINARY BEGINS</div><h1 aria-label="welcome to telos"><span class="welcome">welcome to</span><span class="telos">telos</span></h1><p class="description">새로운 가능성이 시작되는 곳.<br>당신이 함께할 이 순간을 기다렸습니다.</p><button class="celebrate" id="celebrate">환영의 순간 즐기기 <span aria-hidden="true">↗</span></button><div class="hint">A LITTLE SPARK. A GREAT BEGINNING.</div></div></main>
<footer><div class="footer-left"><span class="dot"></span> YOU'RE RIGHT WHERE YOU BELONG.</div><span class="footer-right">반가워요, 여기는 TELOS입니다. ✳</span></footer></div>
<div class="toast" id="toast" role="status">당신의 새로운 시작을 환영합니다 ✦</div>
<script>
const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)'),motion=document.getElementById('motion');
let width=0,height=0,stars=[],sparks=[],paused=reduce.matches,frame=0,last=0,toastTimer;
const colors=['#d4ff79','#84ddea','#efffce','#dd9fff'];
function resize(){width=innerWidth;height=innerHeight;const ratio=Math.min(devicePixelRatio||1,2);canvas.width=width*ratio;canvas.height=height*ratio;canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(ratio,0,0,ratio,0,0);stars=Array.from({length:Math.min(85,Math.floor(width/14))},()=>({x:Math.random()*width,y:Math.random()*height,r:Math.random()*1.2+.3,a:Math.random()*.5+.15,v:Math.random()*.15+.05}));draw(0)}
function draw(dt){ctx.clearRect(0,0,width,height);for(const s of stars){s.y-=s.v*dt;if(s.y<0)s.y=height;ctx.globalAlpha=s.a;ctx.fillStyle='#d7f9e4';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.045*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/100);ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*.07);ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.45);ctx.restore()}ctx.globalAlpha=1;sparks=sparks.filter(p=>p.life>0)}
function tick(time){if(paused){frame=0;return}const dt=last?Math.min((time-last)/16.67,2):1;last=time;draw(dt);frame=requestAnimationFrame(tick)}
function updateMotion(){motion.setAttribute('aria-pressed',String(paused));motion.textContent=paused?'효과 재생 ▷':'효과 일시정지 Ⅱ';document.querySelectorAll('.star,.orbit').forEach(el=>el.style.animationPlayState=paused?'paused':'running');document.getElementById('motion-style')?.remove();if(paused){const style=document.createElement('style');style.id='motion-style';style.textContent='.orbit:after{animation-play-state:paused}';document.head.append(style)}else if(!frame){last=0;frame=requestAnimationFrame(tick)}}
function burst(x,y){for(let i=0;i<110;i++){const angle=Math.random()*Math.PI*2,speed=Math.random()*5+2;sparks.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-2,life:80+Math.random()*40,size:3+Math.random()*5,color:colors[i%colors.length]})}sparks=sparks.slice(-440)}
document.getElementById('celebrate').addEventListener('click',()=>{const toast=document.getElementById('toast');toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2800);if(!paused){burst(width*.26,height*.48);burst(width*.74,height*.48)}});
motion.addEventListener('click',()=>{paused=!paused;updateMotion()});reduce.addEventListener('change',()=>{paused=reduce.matches;updateMotion()});window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;last=0}else if(!paused&&!frame)frame=requestAnimationFrame(tick)});resize();updateMotion();
</script>
</body></html>
